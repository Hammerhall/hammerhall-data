# Паспорт набора: что это, как собирать и проверять, что нужно на вход, куда выпускать. Читают build.sh, CI
# (.github/workflows/data.yml, tools/ci/), заметки к выпуску; общий тест набора (DatasetContract) сверяет паспорт
# с генератором. Формат — строки «ключ=значение» без пробелов вокруг «=», без экранирования и без комментариев
# в строке значения: так паспорт одинаково читают bash, Python и Java.

code=auc
title=Дом Одина
summary=синтетические данные аукционного дома: торги, ставки, счета и расчёты с комитентами
version=auc-data-v1
license=MIT
# java — генератор в auc/src (io.hammerhall.data.auc.Main), сборка — ./build.sh auc
build=java
# профили выпуска: small (≈ 1 %) — архивом, full — файлами; у каждого — ожидания expected/<версия>-<профиль>.json
profiles=small full
# окружение GitHub для выпуска: правило «только теги auc-data-v*» и обязательное одобрение
release.environment=auc-data-release
# full в CI: куча JVM и бюджет времени (больше бюджета — предупреждение в сводке)
full.xmx=5g
full.budget_minutes=60

# Входы: имя (у генератора — --cities ПУТЬ, -Dauc.cities, AUC_CITIES, по умолчанию auc/work/<файл>), откуда CI его
# берёт (release — выпуск этого репозитория) и эталонная сумма: sha256_tsv — содержимого разжатого .tsv.gz.
inputs=cities
input.cities.file=cities.tsv.gz
input.cities.release=sto-data-v1
input.cities.sha256_tsv=d8bbfdf8b08a6df360922c55698e2789835b71f2d1da81c967c9ccd3a8931cee
