# Паспорт набора — формат и ключи как у sto/dataset.properties (общий шаблон наборов, см. README.md в корне).

code=wld
title=Мир
summary=справочник стран и городов мира из открытых источников: страны, города с координатами, языки, соседство, ряды по годам
version=wld-data-v1
license=GeoNames и World Bank — CC BY 4.0, Unicode CLDR — Unicode License v3, Wikidata — CC0
# java — генератор в wld/src (io.hammerhall.data.wld.Main): импорт из снимка источников, сборка — ./build.sh wld
build=java
# профили выпуска: small (города от 100 000 и все столицы) и medium (от 15 000) — архивами, full (от 1 000) — файлами;
# у каждого — ожидания expected/<версия>-<профиль>.json
profiles=small medium full
# что такое профиль у этого набора — для заметок к выпуску (tools/ci/notes.py)
profile.small=города от 100 000 и все столицы
profile.medium=города от 15 000 и все столицы
release.environment=wld-data-release
full.xmx=2g
full.budget_minutes=20

# Вход — снимок источников (GeoNames, World Bank, CLDR, Wikidata; zip): у генератора --source ПУТЬ, -Dwld.source,
# WLD_SOURCE, по умолчанию wld/work/<файл>. CI берёт его из выпуска этого репозитория и сверяет sha256 файла.
inputs=source
input.source.file=wld-source-20261123.zip
input.source.release=wld-source-20261123
# sha256 файла снимка (выпуск wld-source-20261123); та же сумма — в WldDataset.SOURCE
input.source.sha256=c1dbea75bb4d06b11724ddb7e27135d3cf4667867a74e78fc99e635342babac9
