# Паспорт набора — формат и ключи как у sto/dataset.properties (общий шаблон наборов, см. README.md в корне).

code=air
title=Авиаперевозки
summary=данные авиаперевозок на основе демобазы Postgres Pro
version=air-data-v1
license=MIT © 2025 Postgres Professional
# java — генератор в air/src (io.hammerhall.data.air.Main): импорт из выгрузки демобазы, сборка — ./build.sh air
build=java
# профили выпуска: small (≈ 1 % броней full) — архивом, full — файлами; у каждого — ожидания expected/<версия>-<профиль>.json
profiles=small full
release.environment=air-data-release
full.xmx=4g
full.budget_minutes=60

# Вход — выгрузка демобазы «Авиаперевозки» 2.0 (pg_dump, текстовый SQL, gzip): у генератора --dump ПУТЬ, -Dair.dump,
# AIR_DUMP, по умолчанию air/work/<файл>. CI берёт её из выпуска этого репозитория и сверяет sha256 файла.
inputs=dump
input.dump.file=demo-20250901-2y.sql.gz
input.dump.release=air-source-20250901
# sha256 файла снимка (выпуск air-source-20250901); та же сумма — в AirDataset.DUMP
input.dump.sha256=6aa9ca6313768b6b9ee8a6f1e13e902249c9d40fbad59938c7b6cc3dd90af471
