# Паспорт набора — формат и ключи как у sto/dataset.properties (общий шаблон наборов, см. README.md в корне).

code=air
title=Авиаперевозки
summary=данные авиаперевозок на основе демобазы Postgres Pro
version=air-data-v1
license=MIT © 2025 Postgres Professional
# python — выпуск air-data-v1 собран скриптами air/*.py вручную; генератора на Java (air/src) ещё нет, поэтому CI
# (data.yml) тег air-data-v* отклоняет. После переноса — build=java, profiles=small full, входы ниже.
build=python
profiles=full
release.environment=air-data-release
full.xmx=4g
full.budget_minutes=60

# Вход сборки на Java — дамп демобазы «Авиаперевозки» по ссылке со sha256 файла:
#   inputs=dump
#   input.dump.file=…
#   input.dump.url=https://…
#   input.dump.sha256=…
inputs=
