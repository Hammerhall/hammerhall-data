# Паспорт набора — формат и ключи как у sto/dataset.properties (общий шаблон наборов, см. README.md в корне).

code=mov
title=Кино
summary=фильмы, актёры, режиссёры и роли из Wikidata: жанры по словарю из 24 жанров, страны и языки фильмов, съёмочная группа, студии, серии, награды, выход по странам, названия, места съёмок, люди с датами жизни, синтетический рейтинг; синтетика онлайн-кинотеатра «Свартальвхейм» вокруг них
version=mov-data-v1
license=Wikidata — CC0 1.0; города «Мира» (GeoNames) — CC BY 4.0
# java — генератор в mov/src (io.hammerhall.data.mov.Main): импорт из снимка Wikidata, сборка — ./build.sh mov
build=java
# профили выпуска: small (1 % самых известных фильмов) и medium (10 %) — архивами, full (все) — файлами;
# у каждого — ожидания expected/<версия>-<профиль>.json
profiles=small medium full
# что такое профиль у этого набора — для заметок к выпуску (tools/ci/notes.py)
profile.small=1 % самых известных фильмов, 1 % пользователей синтетики
profile.medium=10 % самых известных фильмов, 10 % пользователей синтетики
release.environment=mov-data-release
full.xmx=5g
full.budget_minutes=30

# Вход — снимок Wikidata (zip): у генератора --source ПУТЬ, -Dmov.source, MOV_SOURCE, по умолчанию mov/work/<файл>.
# CI берёт его из выпуска этого репозитория и сверяет sha256 файла.
inputs=source cities
input.source.file=mov-source-20261125.zip
input.source.release=mov-source-20261125
# sha256 файла снимка (выпуск mov-source-20261125); та же сумма — в MovDataset.SOURCE
input.source.sha256=ec6626eeb3725a98375195306ee36f935e7df915e77aaf46d92cba74252ab762
# Второй вход — города набора «Мир» (cities.tsv.gz выпуска wld-data-v1): город места по GeoNames ID или ближайший той
# же страны. У генератора --cities ПУТЬ, -Dmov.cities, MOV_CITIES, по умолчанию mov/work/cities.tsv.gz. CI берёт его
# из выпуска wld-data-v1 и сверяет sha256 содержимого; та же сумма — в MovDataset.CITIES
input.cities.file=cities.tsv.gz
input.cities.release=wld-data-v1
input.cities.sha256_tsv=1536ea827a88fca5692e974d3314bbe296b55a03d6ae692528e22e012e9e792f
