# Паспорт набора: что это, как собирать и проверять, что нужно на вход, куда выпускать. Читают build.sh, CI
# (.github/workflows/data.yml, tools/ci/), заметки к выпуску; общий тест набора (DatasetContract) сверяет паспорт
# с генератором. Формат — строки «ключ=значение» без пробелов вокруг «=», без экранирования и без комментариев
# в строке значения: так паспорт одинаково читают bash, Python и Java.

code=sto
title=Магазин «Кременъ»
summary=синтетические данные интернет-магазина электроники
version=sto-data-v1
license=MIT
# java — генератор в sto/src (io.hammerhall.data.sto.Main), сборка — ./build.sh sto
build=java
# профили выпуска: small (≈ 1 %) — архивом, full — файлами; у каждого — ожидания expected/<версия>-<профиль>.json
profiles=small full
# окружение GitHub для выпуска: правило «только теги sto-data-v*» и обязательное одобрение
release.environment=sto-data-release
# full в CI: куча JVM и бюджет времени (больше бюджета — предупреждение в сводке)
full.xmx=4g
full.budget_minutes=60

# Входы: имя (у генератора — --airports ПУТЬ, -Dsto.airports, STO_AIRPORTS, по умолчанию sto/work/<файл>), откуда
# CI его берёт (release — выпуск этого репозитория, url — ссылка) и эталонная сумма: sha256_tsv — содержимого
# разжатого .tsv.gz, sha256 — файла как есть.
inputs=airports
input.airports.file=airports.tsv.gz
input.airports.release=air-data-v1
input.airports.sha256_tsv=7473494a65e9af17527beebb9d8c632739b079c4b26eb377b65cd5bbde16f62e
